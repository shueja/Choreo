name: WPILib Expression

on: [pull_request, push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Make GCC 14 the default toolchain
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 200
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 200

      - run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWPILIB_EXPRESSION_BUILD_BENCHMARKS=ON
        working-directory: wpilib-expression

      - run: cmake --build build --parallel 4
        working-directory: wpilib-expression

      - run: ctest --test-dir build --output-on-failure
        working-directory: wpilib-expression

      - run: ./build/wpilib_expression_setup_replacement_benchmark
        working-directory: wpilib-expression
